{% extends "base.html" %}{% block content %}<h2>修改管理员密码</h2><p>新密码至少 6 字符，不限制复杂格式。修改成功将撤销所有登录会话，需要重新登录。</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>当前密码 <input type="password" name="current_password" autocomplete="current-password" required></label><label>新密码 <input type="password" name="new_password" autocomplete="new-password" minlength="6" maxlength="1024" required></label><button>保存密码</button></form>{% endblock %}
