<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>统一管理后台</title>
<style>body{font:16px system-ui;background:#f5f7fa;color:#142239;margin:0}main{max-width:1080px;margin:40px auto;padding:24px;background:white;border:1px solid #dbe2ea;border-radius:12px}nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px}a{color:#1659af}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #aab8c8;border-radius:5px}label{display:block;margin:18px 0}textarea{width:95%;min-height:340px;font-family:monospace}button{background:#174e8c;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #dae2eb;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}.hint{color:#53647a;font-size:14px}form{margin:16px 0}</style></head>
<body><main><h1>统一管理后台</h1>{% if csrf and not login %}<nav><a href="/admin">总览</a><a href="/admin/manage/services">客服实例</a><a href="/admin/manage/domains">域名</a><a href="/admin/manage/ai">模型</a><a href="/admin/manage/prompts">提示词</a><a href="/admin/manage/runtime">Runtime</a><a href="/admin/manage/knowledge">知识库配置</a><a href="/admin/manage/channels">渠道配置</a><a href="/admin/maintenance">系统维护</a><a href="/admin/password">修改密码</a></nav>{% endif %}
{% block content %}{% endblock %}
{% if csrf and not login %}<form method="post" action="/admin/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button>退出登录</button></form>{% endif %}</main></body></html>
