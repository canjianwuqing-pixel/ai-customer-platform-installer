<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>统一管理后台</title>
<style>
*{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;background:#f5f7fa;color:#142239;margin:0}main{max-width:1080px;margin:32px auto;padding:28px;background:#fff;border:1px solid #dbe2ea;border-radius:12px;overflow-wrap:anywhere}h1{font-size:26px;margin:0 0 16px}h2{font-size:22px;margin:0 0 12px}nav{display:flex;gap:10px 20px;flex-wrap:wrap;padding:12px 0 20px;margin-bottom:24px;border-bottom:1px solid #e1e7ef}a{color:#1659af;text-underline-offset:3px}input,textarea,select,button,.button{font:inherit;border:1px solid #aab8c8;border-radius:6px;padding:10px 12px}input,textarea,select{max-width:100%;width:100%;background:#fff;color:inherit;min-width:0}input[readonly]{background:#f0f3f7;color:#53647a}input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #83b4f0;outline-offset:2px}input[aria-invalid=true],textarea[aria-invalid=true],select[aria-invalid=true]{border-color:#b42525}label{display:block;margin:14px 0 6px}textarea{resize:vertical;min-height:120px;line-height:1.6}button,.button{display:inline-block;background:#174e8c;color:#fff;cursor:pointer;text-decoration:none;line-height:1.5}button:hover,.button:hover{background:#123c6c}.secondary{background:#fff;color:#174e8c;border-color:#aab8c8}.secondary:hover{background:#edf3fa}.small{font-size:14px;padding:6px 12px;min-height:36px}.hint{color:#53647a;font-size:14px;margin:6px 0}.required{color:#ae2323}.page-heading{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:20px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px}.field{min-width:0}.wide{grid-column:1/-1}.switch-label{display:flex;align-items:center;gap:12px}input[type=checkbox]{appearance:none;width:44px;height:26px;flex-shrink:0;padding:0;border-radius:99px;background:#c5d0df;cursor:pointer}input[type=checkbox]:before{content:"";display:block;width:18px;height:18px;margin:3px;border-radius:50%;background:white}input[type=checkbox]:checked{background:#174e8c}input[type=checkbox]:checked:before{transform:translateX(18px)}.form-actions{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 8px}.rules{border:1px solid #dbe2ea;border-radius:8px;margin:20px 0 0;padding:12px 16px}.rules legend{padding:0 8px}.rule-row{margin:12px 0 20px}.rule-row textarea{min-height:96px;margin-bottom:8px}.notice{border:1px solid;border-radius:8px;padding:12px 16px;margin:16px 0}.notice p{margin:4px 0}.success{background:#eff9f2;border-color:#8abb9a;color:#185b31}.error{background:#fff5f4;border-color:#d9a09c;color:#8e2020}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}td,th{text-align:left;padding:14px 10px;border-bottom:1px solid #dae2eb;vertical-align:top;overflow-wrap:anywhere}.row-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row-actions form{margin:0}pre{white-space:pre-wrap;overflow-wrap:anywhere}form{margin:16px 0}.logout{margin-top:28px;padding-top:20px;border-top:1px solid #e1e7ef}
@media(max-width:640px){main{margin:12px;padding:18px 14px;border-radius:10px}h1{font-size:23px}h2{font-size:20px}nav{gap:8px 16px;margin-bottom:20px}.form-grid{grid-template-columns:minmax(0,1fr);gap:2px}.page-heading{flex-direction:column;gap:8px}td,th{padding:12px 6px;font-size:14px}.form-actions>*{flex:1;text-align:center;min-height:44px}.rules{padding:10px}.row-actions{gap:8px}.small{min-height:40px}}
</style></head>
<body><main><h1>统一管理后台</h1>{% if csrf and not login %}<nav aria-label="管理导航"><a href="/admin">总览</a><a href="/admin/manage/services">客服实例</a><a href="/admin/manage/domains">域名管理</a><a href="/admin/manage/ai">AI 模型</a><a href="/admin/chatwoot">Chatwoot 接入</a><a href="/admin/manage/prompts">提示词</a><a href="/admin/manage/runtime">运行配置</a><a href="/admin/manage/knowledge">知识库配置</a><a href="/admin/manage/channels">渠道配置</a><a href="/admin/maintenance">系统维护</a><a href="/admin/password">修改密码</a></nav>{% endif %}
{% block content %}{% endblock %}
{% if csrf and not login %}<form class="logout" method="post" action="/admin/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="secondary">退出登录</button></form>{% endif %}</main>{% block scripts %}{% endblock %}</body></html>
